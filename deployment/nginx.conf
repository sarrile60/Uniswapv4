server {
    listen 80;
    server_name zenthos-eu.com www.zenthos-eu.com;

    # --- Bot/Scanner Blocking ---
    # Block known crawlers, phishing scanners, and automated tools
    if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebot|ia_archiver|semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|gptbot|ccbot|claudebot|bytespider|amazonbot|twitterbot|linkedinbot|applebot|seznambot|exabot|sogou|blexbot|dataprovider|censysinspect|netcraftsurvey|phishtank|safebrowsing|wappalyzer|builtwith|whatweb|urlscan|virustotal|phishfort|brandshield|bolster|netcraft|openphish|antiphishing|zerofox|cofense|proofpoint|ironscales|python-requests|python-urllib|wget|scrapy|httpclient|go-http-client|node-fetch|libwww-perl|mechanize)) {
        return 403;
    }

    # Block empty user agents
    if ($http_user_agent = "") {
        return 403;
    }

    # --- Security Headers (applied to ALL responses) ---
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://us.i.posthog.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://us.i.posthog.com https://*.posthog.com https://res.cloudinary.com https://api.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; frame-ancestors 'none';" always;

    # --- Robots.txt ---
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001/robots.txt;
        proxy_set_header Host $host;
    }

    # --- API routes (proxy to FastAPI backend) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;

        # No caching for API
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # --- Frontend (serve static React build) ---
    root /opt/zenthos/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ \.env$ {
        deny all;
    }
}
